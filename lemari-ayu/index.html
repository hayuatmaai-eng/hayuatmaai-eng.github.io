<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lemari Ayu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4EEF2; --panel:#FFFFFF; --ink:#2A1F2E; --muted:#7A6A78; --line:#E2D5DE;
  --accent:#A3245E; --accent-ink:#FFFFFF; --chip:#F7F1F5; --good:#2E7D5B; --warn:#B4532A;
  --display:"Gloock", "Didot", "Bodoni 72", Georgia, serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1A1420; --panel:#231B2A; --ink:#F2E9F0; --muted:#A897A6; --line:#3A2E43;
  --accent:#E46A9C; --accent-ink:#1A1420; --chip:#2C2234; --good:#6FCF9F; --warn:#F09A6B; color-scheme:dark }}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:10px 8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
header p{margin:0;color:var(--muted);font-size:13px}
main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
.stage{position:relative;min-height:0;overflow:hidden;background:#EFE4EA}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.stage canvas:active{cursor:grabbing}
.cams{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:10px;top:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cams::-webkit-scrollbar{display:none}
.tools{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;display:flex;gap:8px;flex-wrap:wrap}
.tbtn{font:600 13px var(--body);border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.88);color:#2A1F2E;padding:7px 13px;border-radius:99px;cursor:pointer;backdrop-filter:blur(6px);white-space:nowrap}
.tbtn[aria-pressed="true"]{background:#2A1F2E;color:#fff}
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:14px;padding-block:14px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.challenge{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.challenge h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.challenge p{margin:0;color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:600 14px var(--body);padding:8px 15px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.best{font-size:12px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;flex-shrink:0}
.tabs::-webkit-scrollbar{display:none}
.tab{font:600 14px var(--body);background:none;border:none;color:var(--muted);padding:8px 9px 10px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
#tabBody{display:grid;gap:16px}
.sect{display:grid;gap:9px}
.sect h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:500 14px var(--body);padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.sw{display:flex;flex-wrap:wrap;gap:9px}
.swatch{width:32px;height:32px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.note{font-size:13px;color:var(--muted);margin:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(26,20,32,.45);padding:16px}
.card{background:var(--panel);color:var(--ink);border-radius:18px;padding:20px;width:min(360px,100%);display:grid;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.score{font-family:var(--display);font-size:60px;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:20px;color:var(--muted)}
.stars{color:var(--accent);font-size:22px;letter-spacing:4px}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.card li.ok::before{content:"✓ ";color:var(--good);font-weight:700}
.card li.no::before{content:"✗ ";color:var(--warn);font-weight:700}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#EFE4EA;color:#2A1F2E}
.loading .box{display:grid;gap:10px;width:min(260px,80%);text-align:center}
.bar{height:6px;border-radius:9px;background:rgba(42,31,46,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#A3245E;transition:width .2s}
.loading strong{font-family:var(--display);font-weight:400;font-size:22px}
@media (max-width:760px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,55%) minmax(0,45%)}
  .panel{border-left:none;border-top:1px solid var(--line);padding-block:12px 20px;gap:12px}
  h1{font-size:22px}
  header p{display:none}
  .challenge h2{font-size:19px}
}
@media (prefers-reduced-motion: reduce){ .bar i{transition:none} }
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js","@pixiv/three-vrm":"./lib/three-vrm.module.js"}}</script>
</head>
<body>
<div class="app">
  <header>
    <h1>Lemari Ayu</h1>
    <p>Dandani Ayu sesuai tantangan, atur gaya dan posenya, lalu minta nilai.</p>
  </header>
  <main>
    <section class="stage" id="stage" aria-label="Ruang ganti 3D">
      <canvas id="cv"></canvas>
      <div class="cams" id="cams" role="group" aria-label="Sudut kamera"></div>
      <div class="tools">
        <button class="tbtn" id="bSpin" aria-pressed="false">Putar</button>
        <button class="tbtn" id="bWalk" aria-pressed="false">Catwalk</button>
        <button class="tbtn" id="bRand">Acak</button>
      </div>
      <div class="overlay" id="result" hidden>
        <div class="card" role="dialog" aria-labelledby="rTitle">
          <div class="eyebrow" id="rTheme"></div>
          <div class="score" id="rScore"></div>
          <div class="stars" id="rStars"></div>
          <strong id="rTitle"></strong>
          <ul id="rNotes"></ul>
          <div class="row"><button class="btn primary" id="rClose">Lanjut dandan</button><button class="btn" id="rNext">Tema berikutnya</button></div>
        </div>
      </div>
      <div class="loading" id="loading">
        <div class="box"><strong>Menyiapkan Ayu…</strong><div class="bar"><i id="loadBar"></i></div><span id="loadTxt" style="font-size:13px">Memuat model 3D</span></div>
      </div>
    </section>
    <aside class="panel">
      <div class="challenge">
        <div class="eyebrow">Tantangan hari ini</div>
        <h2 id="chName"></h2>
        <p id="chBrief"></p>
        <div class="row">
          <button class="btn primary" id="bScore">Nilai gaya</button>
          <button class="btn" id="bNextCh">Ganti tema</button>
          <span class="best" id="chBest"></span>
        </div>
      </div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="tabBody"></div>
    </aside>
  </main>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
